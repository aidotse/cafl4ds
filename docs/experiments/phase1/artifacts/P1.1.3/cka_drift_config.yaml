# P1.1.3 — the CKA drift deep dive, items 1-4: read CKA drift where it might tell information loss
# from benign adaptation (CPU, minutes; no new runs).
#
#   uv run python scripts/analyze_cka_drift.py
#
# Inputs are P1.1.2's per-block features (with P1.1.3's support strata in probe.pt), P1.1.0's drives
# and P1.1.1's branches and dial.
features: outputs/p112/features_{bb}
null_root: outputs/p110_deep
root: outputs/p111
reading_report: ${root}/reading_report.json # which damage arms P1.1.1's canary called
alpha: 0.05
floor: 0.25
batch_size: 32 # with min_batch: the short-batch steps the scalar reads blank (P1.1.1)
min_batch: 8
dose0: none
# The scalar null: P1.1.1's 10 healthy IID seeds at every step (its span).
scalars:
  calibration: ["${null_root}/warm/{bb}_o0.0_iid", "${root}/heldout/{bb}_iid"]
  span: 15
# Item 3: the dose-0 twin (AdamW restarted at step 65) against the original drive, same seed and order.
jolt:
  backbones: [mae, je]
  settle: 10 # readings this many steps after the restart on are "settled"
# Item 1: drift on each time-of-day stratum's probe rows (support + query, 270 each). The walk streams
# daytime to step 55, dawn/dusk 56-63, night 65-118: both earlier strata are past from step 65 on.
past:
  backbone: mae
  strata: [daytime, dawn/dusk]
  # The night-block leg checkpoints — where both strata are past; every panel here is calibrated on
  # the 5 IID drives at these alone, so the per-stratum and pooled reads face the same false-alarm bar.
  grid: [step00065, step00108, step00109, step00110, step00114, step00118, final]
  span: 3
  canary: linear_acc
# Item 2: pooled cka_drift calibrated on the 5 healthy walks instead of IID drives (preliminary).
walk_null:
  backbone: mae
# Item 4: JE's lr-1e-4 walk degrades (P1.1.1); its extra drift over IID against the lr-3e-5 pair.
lr_walk:
  backbone: je
  hi: {walk: "${root}/dial/je_walk_alpha0.0_lr1e-4_s012", iid: "${root}/dial/je_iid_alpha0.0_lr1e-4_s012"}
  lo: {walk: "${root}/branch/je_walk_none", iid: "${root}/branch/je_iid_none"}
  canary: linear_acc
  canary_window: 5
out: outputs/p113/cka_report.json
