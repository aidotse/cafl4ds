encoder:
  _target_: cafl4ds.models.vit.TinyViTEncoder
  img_size: ${img_size}
  patch_size: 8
  in_chans: 3
  embed_dim: 96
  depth: 4
  num_heads: 3
  mlp_ratio: 2.0
data:
  _target_: cafl4ds.data.attributes.BDD100KSource
  bdd_root: ${bdd_root}
  split: val
  img_size: ${img_size}
  max_images: ${max_images}
  min_canary_count: 50
stream:
  _target_: cafl4ds.data.regime.RegimeStream
  source: ${data}
  batch_size: ${batch_size}
  block_size: null
  support_per_canary: 45
  query_per_canary: 45
  max_train_per_regime: ${max_train_per_regime}
  seed: ${seed}
  canary_seed: 0
  order: walk
  stratify_canary: true
  well_fraction: 0.5
  well_overlap: 0.0
  select_support_per_canary: 50
  select_query_per_canary: 50
optim:
  _target_: torch.optim.AdamW
  lr: 0.001
  weight_decay: 0.05
img_size: 64
batch_size: 64
seed: 0
device: hpu
bdd_root: /mnt/pr_2018_scaleout_workdir/bdd100k
max_images: null
max_train_per_regime: null
epochs: 30
hflip: true
probe_per_class: 500
knn_k: 20
pixel_grid: 16
