encoder:
  _target_: cafl4ds.models.vit_torchvision.TorchvisionViTEncoder
  state_dict_path: /home/mauricio/.cache/torch/hub/checkpoints/vit_b_16-c867db91.pth
  weights: null
family: je
ssl:
  _target_: cafl4ds.ssl.factory.build_simsiam
  proj_hidden: 256
  proj_dim: 128
  pred_hidden: 64
  anti_collapse: true
monitor:
  _target_: cafl4ds.monitor.HealthMonitor
  knn_k: 20
  run_knn: true
  run_linear: true
  run_alignment: true
  align_seed: 0
  drift_surfaces: true
data:
  _target_: cafl4ds.data.attributes.BDD100KSource
  bdd_root: ${bdd_root}
  split: val
  img_size: ${img_size}
  max_images: ${max_images}
  min_canary_count: 50
stream:
  _target_: cafl4ds.data.regime.RegimeStream
  source: ${data}
  batch_size: ${batch_size}
  block_size: null
  support_per_canary: 45
  query_per_canary: 45
  max_train_per_regime: ${max_train_per_regime}
  seed: ${seed}
  canary_seed: 0
  order: walk
  stratify_canary: true
  well_fraction: 0.5
  well_overlap: 0.0
  select_support_per_canary: 50
  select_query_per_canary: 50
optim:
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.05
init:
  mode: from_scratch
  checkpoint: null
img_size: 224
batch_size: 32
seed: 0
device: hpu
bdd_root: /mnt/pr_2018_scaleout_workdir/bdd100k
max_images: null
max_train_per_regime: null
warmup:
  window: 20
  tol: 0.001
  min_steps: 40
  max_steps: 3000
  max_passes: 100
  grad_clip: 1.0
  stop: budget
  select_every: 100
  drive_read_per_class: 500
  competence:
    key: knn_acc
    window: 500
    min_gain: 0.01
    min_steps: 1000
well_out: outputs/p110_vitb_scout/wells/je_vit_b16_pretrained_lr1e-4.pt
