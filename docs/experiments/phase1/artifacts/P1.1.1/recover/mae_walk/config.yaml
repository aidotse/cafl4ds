encoder:
  _target_: cafl4ds.models.vit_mae_pretrained.MAEPretrainedViTEncoder
  state_dict_path: /mnt/cifar100/mae_pretrain_vit_base.pth
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
family: mae
ssl:
  _target_: cafl4ds.ssl.factory.build_mae
  mask_ratio: 0.75
  decoder_dim: 64
  decoder_depth: 2
  decoder_heads: 4
  decoder_mlp_ratio: 2.0
  norm_pix_loss: true
monitor:
  _target_: cafl4ds.monitor.HealthMonitor
  knn_k: 20
  run_knn: true
  run_linear: true
  run_alignment: true
  align_seed: 0
  drift_surfaces: false
data:
  _target_: cafl4ds.data.attributes.BDD100KSource
  bdd_root: ${bdd_root}
  split: val
  img_size: ${img_size}
  max_images: ${max_images}
  min_canary_count: 50
stream:
  _target_: cafl4ds.data.regime.RegimeStream
  source: ${data}
  batch_size: ${batch_size}
  block_size: null
  support_per_canary: 45
  query_per_canary: 45
  max_train_per_regime: ${max_train_per_regime}
  seed: ${seed}
  canary_seed: 0
  order: walk
  stratify_canary: true
  well_fraction: 0.5
  well_overlap: 0.0
  select_support_per_canary: 150
  select_query_per_canary: 150
filter:
  _target_: cafl4ds.filters.accept_all.AcceptAll
optim:
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.05
init:
  mode: from_scratch
  checkpoint: null
pc:
  kind: collapse
  ssl:
    _target_: cafl4ds.ssl.factory.build_simsiam
    proj_hidden: 256
    proj_dim: 128
    pred_hidden: 64
    anti_collapse: false
  epochs: 4
img_size: 224
batch_size: 32
seed: 0
device: hpu
eval_every: 1
seeds:
- 0
- 1
- 2
well: wells/p110_deep/mae_o0.0.pt
anchor: ${well}
checkpoint_legs: false
resume:
  checkpoint: outputs/p110_deep/warm/mae_o0.0_walk/checkpoints/s{seed}/final.pt
  step: 0
damage:
  mode: none
  k: 0
  scale: 0.0
  seed: ${seed}
doses: []
recovery_steps: 60
bdd_root: /mnt/pr_2018_scaleout_workdir/bdd100k
max_images: null
max_train_per_regime: null
gate_arms: false
gate:
  pc_loss_floor_max: -0.3
  pc_rankme_drop_frac: 0.6
tier_b:
  rankme_lo: 0.5
  rankme_hi: 1000.0
  min_final_drift: 0.0
  canary_margin: 0.0
log_signals: null
long_horizon: false
long_horizon_passes: 4
long_horizon_growth_frac_max: 0.1
run_name: null
study: P1.1.1
