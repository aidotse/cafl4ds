# Rebuild and redeploy the GitHub Pages site (docs + slide decks) from main, on demand.
#
# The release pipeline (reusable-pipeline.yml) publishes the site only when a release is cut.
# Run this from the Actions tab ("Publish site" > Run workflow, on main) to publish doc or
# slide changes in between. It builds exactly what the release docs job builds: tests and
# coverage for the exported pages, `poe docs`, then the slide decks (slides/build.sh).
# A repository has one Pages site, so every deployment replaces the whole site; this one
# and the release deploy publish the same content from different commits.
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; never cancel one that is in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The github-pages environment only accepts deployments from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra cpu --dev
      - name: Tests + coverage (for the docs' exported pages)
        run: |
          uv run poe test 4
          uv run poe export-test-artifacts
      - name: Build docs
        run: uv run poe docs
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.19"
      - name: Build slides
        run: bash slides/build.sh public/slides
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # OIDC for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
