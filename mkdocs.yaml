site_name: "cafl4ds"
site_author: "Mauricio Munoz"
site_description: "Continuous, Active Federated Learning for Data Streams"
site_url: "https://aidotse.github.io/cafl4ds/"
repo_url: "https://github.com/aidotse/cafl4ds"
site_dir: public

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

# Note: docs/user-guide.md is the generated project's own Getting Started page. PyMaxQ's own docs site uses
# docs/getting-started.md as its Getting Started and additionally surfaces user-guide.md under a
# "Generated Project Guide" nav entry (labelled to show it documents a generated project); see docs/developing.md.
nav:
  - Home: index.md
  - Getting Started: user-guide.md
  - Developing: developing.md
  - Project Plan:
      - project-plan/index.md
      - Novelty & positioning: project-plan/novelty.md
      - Building blocks: project-plan/building-blocks.md
      - Experiments (baselines, phases, matrix): project-plan/experiments.md
      - Metrics (signals, control, eval): project-plan/metrics.md
      - Reading list: project-plan/reading-list.md
      - Risks & gates: project-plan/risks.md
  - Latest Results:
      - experiments/latest-results/index.md
      - P0.1: experiments/latest-results/P0.1.md
      - P0.2.0: experiments/latest-results/P0.2.0.md
      - P0.2.1: experiments/latest-results/P0.2.1.md
      - P0.2.2: experiments/latest-results/P0.2.2.md
      - P0.2.3: experiments/latest-results/P0.2.3.md
      - P0.2.4: experiments/latest-results/P0.2.4.md
      - P0.3.0: experiments/latest-results/P0.3.0.md
      - P0.3.1: experiments/latest-results/P0.3.1.md
      - P0.3.2: experiments/latest-results/P0.3.2.md
      - P0.3.3: experiments/latest-results/P0.3.3.md
      - P0.3.4: experiments/latest-results/P0.3.4.md
      - P0.3.5: experiments/latest-results/P0.3.5.md
      - P0.3.6: experiments/latest-results/P0.3.6.md
      - P0.3.7: experiments/latest-results/P0.3.7.md
      - P0.3.8: experiments/latest-results/P0.3.8.md
      - P0.3.9: experiments/latest-results/P0.3.9.md
      - P0.4.0: experiments/latest-results/P0.4.0.md
      - P0.4.1: experiments/latest-results/P0.4.1.md
      - P0.5.0: experiments/latest-results/P0.5.0.md
      - P0.5.1: experiments/latest-results/P0.5.1.md
      - P0.5.2: experiments/latest-results/P0.5.2.md
      - P0.5.3: experiments/latest-results/P0.5.3.md
      - P0.6.0: experiments/latest-results/P0.6.0.md
      - P0.6.1: experiments/latest-results/P0.6.1.md

  - Phase 0:
      - experiments/phase0/index.md
      - P0.1 Instrument (streaming loop): experiments/phase0/P0.1.md
      - P0.2.0 Positive control (collapse gate - first investigation): experiments/phase0/P0.2.0.md
      - P0.2.1 Positive control (collapse gate - baseline): experiments/phase0/P0.2.1.md
      - P0.2.2 Positive control (collapse gate - full metric suite): experiments/phase0/P0.2.2.md
      - P0.2.3 Positive control (collapse gate - redundancy vehicle): experiments/phase0/P0.2.3.md
      - P0.2.4 Positive control (collapse gate - false-positive stress): experiments/phase0/P0.2.4.md
      - P0.3.0 Positive control (forgetting gate - making forgetting real): experiments/phase0/P0.3.0.md
      - P0.3.1 Positive control (forgetting gate - operating point + drift verdict): experiments/phase0/P0.3.1.md
      - P0.3.2 Positive control (forgetting gate - multi-seed robustness): experiments/phase0/P0.3.2.md
      - P0.3.3 Positive control (forgetting gate - batch-size probe): experiments/phase0/P0.3.3.md
      - P0.3.4 Positive control (forgetting gate - supervised upper-limit): experiments/phase0/P0.3.4.md
      - P0.3.5 Positive control (forgetting gate - fire audit, genuine/permanent): experiments/phase0/P0.3.5.md
      - P0.3.6 Positive control (forgetting gate - SSL-MAE fire, label-free): experiments/phase0/P0.3.6.md
      - P0.3.7 Positive control (forgetting gate - savings audit): experiments/phase0/P0.3.7.md
      - P0.3.8 Positive control (forgetting gate - hard-disjoint vehicle): experiments/phase0/P0.3.8.md
      - P0.3.9 Positive control (forgetting gate - well-depth de-confound): experiments/phase0/P0.3.9.md
      - P0.4.0 Positive control (instability gate - LR-driven divergence): experiments/phase0/P0.4.0.md
      - P0.4.1 Positive control (instability gate - data-driven surprise/shock): experiments/phase0/P0.4.1.md
      - P0.5.0 Positive control (representation degradation - mask-ratio vehicle): experiments/phase0/P0.5.0.md
      - P0.5.1 Positive control (representation degradation - over-powered-decoder lever): experiments/phase0/P0.5.1.md
      - P0.5.2 Positive control (representation degradation - full-rank crater + MAE-native readers): experiments/phase0/P0.5.2.md
      - P0.5.3 Positive control (representation-health gate - the quality-vs-lever test): experiments/phase0/P0.5.3.md
      - P0.6.0 Positive control (forgetting gate - the joint-embedding forgetting vehicle): experiments/phase0/P0.6.0.md
      - P0.6.1 Positive control (forgetting gate - the *past-data-free* drift reader on JE): experiments/phase0/P0.6.1.md
  - Audits:
      - P0.2 (collapse mode): experiments/audits/P0.2.md
      - P0.3 (forgetting mode): experiments/audits/P0.3.md
      - P0.4 (instability mode): experiments/audits/P0.4.md
      - P0.5 (representation degradation mode): experiments/audits/P0.5.md
      - P0.6 (forgetting mode on JE): experiments/audits/P0.6.md
  - API Reference: reference.md
  - Tests: exported/pytest.html
  - Coverage: exported/coverage/index.html

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  icon:
    repo: fontawesome/brands/git-alt
  font: false
  palette:
    - scheme: default
      accent: blue
      media: "(prefers-color-scheme: light)"
      primary: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      accent: blue
      media: "(prefers-color-scheme: dark)"
      primary: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - header.autohide
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.top
    - toc.follow
    - toc.integrate
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search
    - search.highlight
    - search.suggest
    - tags

copyright: "Copyright © 2026 AI Sweden"
