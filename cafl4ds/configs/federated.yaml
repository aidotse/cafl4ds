# Federated Phase-0 streaming loop — FedAvg over per-client single-pass streams.
#
# One dataset is partitioned across `num_clients` clients (the D factor); each client runs the
# same streaming SSL loop on its own shard, and every `steps_per_round` stream steps the server
# FedAvg-averages their weights. Clients continue their stream across rounds (true single pass)
# and drop out as they exhaust. Global-model health is logged once per round.
#
# Fast network-free smoke (no data download):
#   uv run python scripts/run_federated.py data=synthetic img_size=16 num_clients=3 \
#     support_per_class=3 query_per_class=2 era_eval_per_class=1 partition.scheme=iid
#
# STL-10 on GPU:
#   uv run python scripts/run_federated.py device=cuda data_root=/home/edgelab/stl10 \
#     ssl=simsiam num_clients=4 partition.alpha=1.0 batch_size=64
#
# Pick an FL strategy; tune it through its nested keys. Note `server_optimizer.lr` is the SERVER
# learning rate, a different quantity from the client `optim.lr`:
#   uv run python scripts/run_federated.py strategy=fedadam strategy.server_optimizer.lr=1e-2
#   uv run python scripts/run_federated.py strategy=fedprox strategy.proximal_mu=0.1
#   uv run python scripts/run_federated.py strategy=fedprox_fedadam
#
# Sweep strategies against a partition sharpness (the D factor) with `-m`:
#   uv run python scripts/run_federated.py -m strategy=fedavg,fedadam,fedprox partition.alpha=0.1,1.0
defaults:
  - encoder: tiny
  - ssl: simsiam # C factor: mae | simsiam
  - data: stl10 # data source: stl10 | synthetic
  - stream: class_blocked # F factor: only `order` is read (class_blocked | iid)
  - filter: accept_all # A factor: B-floor (same filter on every client, own local state)
  - monitor: default
  - optim: adamw # the CLIENT optimizer (per-client, instantiated in the run script)
  # The FL algorithm, as one choice. Each strategy sets both halves of a round (the server's
  # rule for applying the aggregate, and any client-side constraint):
  #   fedavg | fedadam | fedyogi | fedadagrad | fedprox | fedprox_fedadam
  - strategy: fedavg
  - init: from_scratch # I factor: from_scratch | pretrained
  - _self_

# Shared scalars (interpolated into the groups above).
img_size: 32
batch_size: 32
seed: 0
device: cpu
eval_every: 5

# Data sizing.
data_root: /mnt/stl10
max_per_class: 500 # cap images loaded per class from the source
max_train_per_class: null # no cap on training images per class (after held-out reservations)

# Per-client held-out reservations — smaller than the centralized defaults, because each client
# holds only a slice of the data and non-IID skew makes some per-class counts small. If a run
# hits "class X has N images but M are reserved", lower these or raise partition.alpha.
support_per_class: 5
query_per_class: 5
era_eval_per_class: 2

# --- Global readout vs per-client reservations --------------------------------------------------
# The three keys above now size the GLOBAL monitor's eval sets only (the dependent variable).
#
# Images per class carved out of the dataset for that monitor BEFORE partitioning, so no client
# can train on what the aggregated model is scored on. `null` = the minimum the global stream
# needs (support + query + era_eval + 1). `0` disables the split — correct ONLY when the client
# and global streams coincide anyway, i.e. num_clients=1 with matching client reservations below
# (the F1 exact-reproduction arm); any other run with 0 leaks client training data into the eval.
global_holdout_per_class: null
#
# Per-client reservations. Zero by default: a client's local eval sets are NEVER read in a
# federated run (nothing calls `measure_health`, and the client drives `train_step` rather than
# `StreamingLoop.run`), so reserving per-client data only withholds it from training — and the
# per-class check then fails on sharply skewed shards (100-class CIFAR-100 at any Dirichlet
# alpha). Set these to match the centralized run only for the num_clients=1 parity arm.
client_support_per_class: 0
client_query_per_class: 0
client_era_eval_per_class: 0

# Federation.
num_clients: 4
steps_per_round: 5 # stream steps (batches) each client advances per round
num_rounds: null # null = run until every client's stream is exhausted
partition:
  scheme: dirichlet # dirichlet (label-skewed non-IID) | iid (uniform control)
  alpha: 1.0 # Dirichlet concentration; smaller = sharper per-client class skew

# Warm-start checkpoints (I=pretrained). Resolved to an absolute path by the run script.
pretrain_dir: outputs/pretrain

# Run logs: one JSONL per client plus one for the aggregated global model, in the Hydra run dir.
run_log: run_log.jsonl

loop:
  _target_: cafl4ds.loop.StreamingLoop
  eval_every: ${eval_every}
  grad_clip: 1.0
  device: ${device}
