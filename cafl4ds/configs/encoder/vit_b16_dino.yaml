# DINO-pretrained ViT-B/16 (Caron et al. 2021, the official backbone checkpoint) — P1.2.4's stronger frozen floor,
# an invariance-trained off-the-shelf backbone beside the MAE B5. The checkpoint uses the same timm-style keys as the
# MAE one, so it loads strict-clean through the same class (inputs resized to 224 + ImageNet-normalized inside).
# Fetched from https://dl.fbaipublicfiles.com/dino/dino_vitbase16_pretrain/dino_vitbase16_pretrain.pth
# (sha256 bf34ad0f424b9029b593e8dc3ed553bf26e88bcba0d32bf3e62a6209cb64c85e); mount its directory on the Gaudi node.
_target_: cafl4ds.models.vit_mae_pretrained.MAEPretrainedViTEncoder
state_dict_path: /home/mauricio/data/weights/dino_vitbase16_pretrain.pth
img_size: 224
patch_size: 16
embed_dim: 768
depth: 12
num_heads: 12
mlp_ratio: 4.0
