# Server optimizer = FedYogi (Reddi et al. 2021, after Zaheer et al. 2018). Same shape as
# FedAdam, but the second moment changes by an amount proportional to delta^2 rather than to v
# itself, so it cannot collapse towards zero and blow up the step. Reach for this if FedAdam
# shows round-to-round spikes under a sharp partition (small `partition.alpha`).
#
# See `fedadam.yaml` for what `lr` and `tau` mean — the same caveats apply. `v_init` is positive
# here because the additive rule has no decay to shrink an over-large early estimate.
_target_: cafl4ds.federated.server_optim.FedYogiServer
lr: 1.0e-2
beta_1: 0.9
beta_2: 0.99
tau: 1.0e-3
bias_correction: true # first moment only; the additive second moment is left as-is
v_init: 1.0e-6
