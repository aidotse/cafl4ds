# P1.1.3 item 5 — read P0.3.9's natural MAE forgetting per block, from the states the re-run saved.
#
#   uv run python scripts/read_forgetting_lenses.py
#
# Each run dir is scripts/positive_control_forgetting.py at P0.3.9's epochs_b=40 operating point with
# save_states=true (docs/experiments/phase1/artifacts/P1.1.3/queue_forgetting.sh).
runs: outputs/p113/forgetting/epochsb40_seed{seed}
seeds: [0, 1, 2, 3, 4]
# The re-run must reproduce P0.3.9's promoted BWT (both arms, every seed) before its states are read.
promoted: docs/experiments/phase0/artifacts/P0.3.9/d1redo_epochsb40/comparison_epochsb40_seed{seed}.json
tolerance: 0.005
arms: {healthy: mae_healthy_replay_r1, pc: mae_pc_forget}
# The lenses the sign-flip test searches over (every layer each). TwoNN has no known harmful direction,
# and a two-sided test over 5 seeds cannot reach p = 1/32, so it is reported, not tested.
tested: [cka_drift, dcka_drift, procrustes_drift, rankme]
device: cpu
# CPU threads: the SVD lenses slow ~100x when oversubscribed (e.g. beside HPU runs sharing the cores).
threads: 8
batch_size: 100
out: outputs/p113/forgetting_lenses.json
