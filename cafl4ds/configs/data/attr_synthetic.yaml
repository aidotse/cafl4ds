# Network-free attributed images (two axes: era-key regime + canary) for the Tier-A wiring check
# and unit tests — lets the whole deployment rig run from a fresh clone with no dataset.
_target_: cafl4ds.data.attributes.SyntheticAttributeSource
num_regimes: 4
num_canary_classes: 4
per_cell: 24
img_size: ${img_size}
channels: 3
noise: 0.3
regime_tint: 0.15
long_tail: true
seed: ${seed}
# P1.2.5: synthetic boxes and a drivable grid (the stand-in for BDD's geometry labels); the grid is the patch grid
geometry: false
drivable_grid: 4
